name: Multi-Company Jobs Full Scrape

on:
  workflow_dispatch:
    inputs:
      companies:
        description: Comma-separated company slugs to seed into seen_jobs/
        required: false
        default: apple,amazon,cvs,cvs_wd,goldman-sachs,google,lyft,meta,salesforce,uber

permissions:
  contents: write

jobs:
  full-scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run full scraper
        id: run_full_scraper
        continue-on-error: true
        env:
          COMPANIES: ${{ inputs.companies }}
        run: python full_scrape.py

      - name: Upload full-scrape diagnostics
        if: steps.run_full_scraper.outcome == 'failure' && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: full-scrape-diagnostics
          path: artifacts/
          if-no-files-found: ignore

      - name: Commit updated seen-job files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs
          if git diff --cached --quiet; then
            echo "No seen_jobs changes to commit."
            exit 0
          fi
          git commit -m "chore: full scrape - update seen jobs [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
