name: Multi-Company Jobs Notifier

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      companies:
        description: Comma-separated company slugs to scrape
        required: false
        default: apple,amazon,cvs,cvs_wd,goldman-sachs,google,lyft,meta,salesforce,uber

permissions:
  contents: write

concurrency:
  group: job-buddy-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run scraper
        id: run_scraper
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_API_URL: ${{ secrets.GREENAPI_API_URL || 'https://api.green-api.com' }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          COMPANIES: ${{ inputs.companies || vars.COMPANIES || 'all' }}
          INCLUDE_KEYWORDS: ${{ vars.INCLUDE_KEYWORDS }}
          MAX_PAGES_CAP: ${{ vars.MAX_PAGES_CAP }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD }}
          US_ONLY: "1"
          ALLOW_REMOTE: "1"
        run: python scraper.py

      - name: Upload scraper diagnostics
        if: steps.run_scraper.outcome == 'failure' && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: scraper-diagnostics
          path: artifacts/
          if-no-files-found: ignore

      - name: Commit updated seen-job files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs
          if git diff --cached --quiet; then
            echo "No seen_jobs changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen jobs [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail workflow if scraper failed
        if: steps.run_scraper.outcome == 'failure'
        run: exit 1
